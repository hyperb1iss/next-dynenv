packages:
  - '.'
  - 'docs'
  - 'examples/*'
  - 'test-app'

catalog:
  # Core framework
  next: ^16.4.3
  react: ^19.3.1
  react-dom: ^19.3.1

  # TypeScript
  typescript: ^7.0.2
  '@types/node': ^26.6.6
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0

  # Testing
  vitest: ^5.0.5
  '@vitest/coverage-v8': ^5.0.5
  jsdom: ^30.1.3
  '@testing-library/jest-dom': ^7.0.1
  '@testing-library/react': ^16.3.3

  # Linting & Formatting
  '@biomejs/biome': ^2.6.4
  prettier: ^3.9.10

overrides:
  # vitepress-plugin-llms pins minimatch ^10, whose advisories are fixed
  # only in 11.x. The plugin only calls minimatch(path, glob), which is
  # unchanged in 11.
  'vitepress-plugin-llms>minimatch': ^11.0.4
