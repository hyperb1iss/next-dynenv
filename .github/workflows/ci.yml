name: CI

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ════════════════════════════════════════════════════════════════════
  # Quality Checks (parallel)
  # ════════════════════════════════════════════════════════════════════
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Biome
        run: pnpm biome ci .

      - name: Prettier
        run: pnpm prettier --check "**/*.{md,mdx,yml,yaml}"

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Type check
        run: pnpm typecheck

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Audit all dependencies
        run: pnpm audit --audit-level moderate

  # ════════════════════════════════════════════════════════════════════
  # Build & Test
  # ════════════════════════════════════════════════════════════════════
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: pnpm build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: build/
          retention-days: 1

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build
          path: build/

      - name: Run unit tests
        run: pnpm test:coverage

      - name: Run integration tests
        run: pnpm test:integration

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          fail_ci_if_error: false

  examples:
    name: Examples
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build
          path: build/

      - name: Build examples
        run: pnpm --filter "./examples/*" build

  # ════════════════════════════════════════════════════════════════════
  # Docs Build Verification
  # ════════════════════════════════════════════════════════════════════
  docs:
    name: Docs Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup
        with:
          filter: next-dynenv-docs

      - name: Build docs
        run: pnpm --filter next-dynenv-docs build

  # ════════════════════════════════════════════════════════════════════
  # Status Check (branch protection)
  # ════════════════════════════════════════════════════════════════════
  status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [lint, typecheck, security, build, test, examples, docs]
    if: always()
    steps:
      - name: Check status
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.typecheck.result }}" != "success" ] || \
             [ "${{ needs.security.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.examples.result }}" != "success" ] || \
             [ "${{ needs.docs.result }}" != "success" ]; then
            echo "::error::One or more jobs failed"
            exit 1
          fi
          echo "All checks passed!"

      - name: Summary
        if: always()
        run: |
          mark() { [ "$1" = "success" ] && echo "●" || echo "○"; }
          {
            echo "## CI Results"
            echo ""
            echo "| Check | Status |"
            echo "|-------|--------|"
            echo "| Lint & Format | $(mark "${{ needs.lint.result }}") |"
            echo "| Type Check | $(mark "${{ needs.typecheck.result }}") |"
            echo "| Security Audit | $(mark "${{ needs.security.result }}") |"
            echo "| Build | $(mark "${{ needs.build.result }}") |"
            echo "| Test | $(mark "${{ needs.test.result }}") |"
            echo "| Examples | $(mark "${{ needs.examples.result }}") |"
            echo "| Docs | $(mark "${{ needs.docs.result }}") |"
          } >> "$GITHUB_STEP_SUMMARY"
